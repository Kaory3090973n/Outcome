<title>OUTCOME</title>
<style>

  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

}

/* Sprites desenhados por caminho (iguais às artes de referência), usados em partida: na mão, arremessada, deslizando e no chão.
   Coordenadas da arma: x para a frente, a mão segura perto de x = 0. A tela ARMAS continua usando as silhuetas. */
{
  const INK = '#1b1b1f';
  const cp = (px, py) => [(px - 215) * .0415 - 9, (py - 510) * .0415];   // cutelo: pixel da arte -> unidades
  WEAPONS.cleaver.art = function () {
    const P = (...a) => a.length === 2 ? cp(a[0], a[1]) : null, M = (x, y) => ctx.moveTo(...cp(x, y)), L = (x, y) => ctx.lineTo(...cp(x, y));
    const C = (a, b, c, d, e, f) => ctx.bezierCurveTo(...cp(a, b), ...cp(c, d), ...cp(e, f)), Q = (a, b, c, d) => ctx.quadraticCurveTo(...cp(a, b), ...cp(c, d));
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.1; ctx.strokeStyle = INK;
    // cabo de madeira com a ponta curva
    ctx.beginPath(); M(300, 445); L(690, 420); L(690, 515); L(440, 540); C(380, 560, 340, 600, 300, 610); C(250, 612, 222, 580, 220, 520); C(218, 480, 250, 445, 300, 445); ctx.closePath();
    ctx.fillStyle = '#5a3a24'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); M(340, 462); L(675, 446); ctx.strokeStyle = '#7d5232'; ctx.lineWidth = .6; ctx.stroke();
    for (const [rx, ry] of [[318, 502], [466, 485], [620, 475]]) { ctx.beginPath(); ctx.arc(...cp(rx, ry), .75, 0, TAU); ctx.fillStyle = '#e3b94d'; ctx.fill(); ctx.lineWidth = .45; ctx.strokeStyle = '#2a1d10'; ctx.stroke(); }
    // lâmina larga de aço, com o furo no canto
    ctx.lineWidth = 1.1; ctx.strokeStyle = INK;
    ctx.beginPath(); M(697, 433); L(790, 426); L(900, 408); L(1040, 376); L(1170, 342); Q(1232, 322, 1262, 352); L(1278, 385); L(1318, 572); Q(1322, 580, 1300, 584); L(1085, 628); L(912, 655); L(745, 664); Q(730, 664, 727, 645); L(712, 545); L(700, 525); ctx.closePath();
    ctx.fillStyle = '#adadb0'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(...cp(1203, 402), 1.3, 0, TAU); ctx.fillStyle = INK; ctx.fill(); ctx.beginPath(); ctx.arc(...cp(1203, 402), .62, 0, TAU); ctx.fillStyle = '#f3f3f3'; ctx.fill();
  };
  WEAPONS.cleaver.bb = [-9.6, -8.4, 37.6, 7.1];
  WEAPONS.cleaver.parts = [[-9, 0, 46, 14, '#0000', 0]];   // só a medida (centralização); o desenho é o art
  WEAPONS.crowbar.art = function () {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const path = () => { ctx.beginPath(); ctx.moveTo(-15.6, -6.6); ctx.bezierCurveTo(-12, -5, -10, 6.5, -7.5, 6.2); ctx.bezierCurveTo(-4.5, 6, -1.5, 3, 1.5, 0); ctx.lineTo(40.5, 0); ctx.quadraticCurveTo(44.5, 0, 47, 2.6); ctx.lineTo(51.7, 5.4); };
    path(); ctx.strokeStyle = INK; ctx.lineWidth = 6.4; ctx.stroke();           // contorno
    path(); ctx.strokeStyle = '#474c58'; ctx.lineWidth = 5; ctx.stroke();      // aço escuro
    ctx.beginPath(); ctx.moveTo(6, -1.3); ctx.lineTo(38, -1.3); ctx.strokeStyle = '#8b93a5'; ctx.lineWidth = .9; ctx.stroke();   // brilho da barra
    ctx.beginPath(); ctx.moveTo(-9.6, 5.1); ctx.lineTo(-7, 5.3); ctx.moveTo(44.5, 1.6); ctx.lineTo(48, 3.1); ctx.stroke();      // brilho na curva da garra e na ponta
    ctx.beginPath(); ctx.moveTo(-16.6, -7.4); ctx.lineTo(-13.4, -4.8); ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.stroke();  // entalhe em V da garra
  };
  WEAPONS.crowbar.bb = [-18.5, -9.8, 53.5, 9.8];
  WEAPONS.crowbar.parts = [[-16, 0, 68, 14, '#0000', 0]];
  WEAPONS.crowbar.extra = null;
}

{
  const LEN = { glock: 28, beretta: 32, m1911: 32, python: 38, deagle: 40, sawed: 46,
    knuckles: 14, pocket: 26, butterfly: 26, cleaver: 38, bottle: 36, wrench: 46, crowbar: 72, sledge: 78 };   // mesmo tamanho na mão, no ar (arremessada) e no chão   // 10, 20, 22, 30, 30, 45, 76 e 90 cm
  for (const k in LEN) {
    const w = WEAPONS[k]; w.len = LEN[k]; if (w.knuckle) continue;   // soco-inglês: desenhado na mão do personagem, só o chão usa len
    const mn = Math.min(...w.parts.map(q => q[0])), mx = Math.max(...w.parts.map(q => q[0] + q[2])), v = LEN[k] / (mx - mn);
    w.vis = v; if (!w.melee) w.muzzle *= v;   // o cano acompanha a escala
  }
}

const WKEYS = [

  ...Object.keys(WEAPONS).filter(k => !WEAPONS[k].melee).sort((a, b) => WEAPONS[b].dmg * WEAPONS[b].pellets - WEAPONS[a].dmg * WEAPONS[a].pellets),
];
/* Sprite cartoon da arma deitada no chão (vista lateral, cano para a direita). Partes: [x, yCentro, largura, altura, cor, raio, giro] */
function sideBox(w) { if (w.art) { const [x0, y0, x1, y1] = w.bb; return { x0, x1, y0, y1, w: x1 - x0, h: y1 - y0 }; }   // arma desenhada por caminho: usa a caixa dela
  const x0 = Math.min(...w.side.map(q => q[0])), x1 = Math.max(...w.side.map(q => q[0] + q[2])), y0 = Math.min(...w.side.map(q => q[1] - q[3] / 2)), y1 = Math.max(...w.side.map(q => q[1] + q[3] / 2)); return { x0, x1, y0, y1, w: x1 - x0, h: y1 - y0 }; }
function drawSide(w) {
  const B = sideBox(w); ctx.save(); ctx.translate(-(B.x0 + B.x1) / 2, -(B.y0 + B.y1) / 2);
  if (w.art) { w.art(); ctx.restore(); return; }
  for (const [x, cy, pw, ph, col, r, rot] of w.side) {
    ctx.save(); if (rot) { ctx.translate(x + pw / 2, cy); ctx.rotate(rot); ctx.translate(-(x + pw / 2), -cy); }
    ctx.beginPath(); ctx.roundRect(x, cy - ph / 2, pw, ph, r);
    ctx.fillStyle = col === '@' ? w.accent : col; ctx.fill();
    ctx.lineWidth = 1.3; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.9)'; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x + 1, cy - ph / 2 + .6, Math.max(pw - 2, 1), Math.max(ph * .28, 1), r);
    ctx.fillStyle = 'rgba(255,255,255,.17)'; ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawWeapon(w) {
  if (w.art) { w.art(); return; }   // arma desenhada por caminho (cutelo, pé de cabra)
  for (const [x, cy, pw, ph, col, r] of w.parts) {
    ctx.beginPath(); ctx.roundRect(x, cy - ph / 2, pw, ph, r);
    ctx.fillStyle = col === '@' ? w.accent : col; ctx.fill();
    ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x + 1, cy - ph / 2 + .6, Math.max(pw - 2, 1), Math.max(ph * .3, 1), r);
    ctx.fillStyle = 'rgba(255,255,255,.17)'; ctx.fill();
  }
  if (w.extra) w.extra();
}

    modificado: [
      'Em partida (na mão, no chão, arremessada e no deslize) cada arma agora tem tamanho proporcional ao tamanho real: soco-inglês e canivete pequenos, pistolas médias, espingarda serrada maior, e chave de tubo, pé de cabra e marreta bem compridos. Antes todas no chão tinham o mesmo tamanho.',
      'No HUD do canto inferior direito, a silhueta branca da arma agora tem o mesmo tamanho para todas as armas.',
    ] },
  { n: 83, v: '0.47.1', title: 'Novos sprites: cutelo e pé de cabra',
    modificado: [
      'O cutelo e o pé de cabra ganharam novos desenhos em partida (na mão, arremessados, no deslize e caídos no chão): cutelo com cabo de madeira, rebites dourados e furo na lâmina; pé de cabra de aço com a garra em V curvada e a ponta achatada. A tela ARMAS continua como estava.',
    ] },
  { n: 82, v: '0.47.0', title: 'Destros e canhotos',
    criado: [
      'Cada personagem agora é destro ou canhoto (aparece como MÃO DOMINANTE na tela PERSONAGENS). Como na vida real, cerca de 1 em cada 10 pessoas é canhota: entre os 8 personagens, só o DENTE é canhoto.',
      'A mão dominante segura a arma: nos canhotos a arma, o braço esticado, a cápsula ejetada e o deslize ficam espelhados para a esquerda.',
    ],
    modificado: [
      'O soco-inglês agora fica só na mão dominante do personagem (a direita nos destros). Com ele equipado, os socos alternam entre as mãos, mas cerca de 70% saem da mão dominante, e só esses levam o dano extra do soco-inglês.',
      'O micro-atordoamento da trombada no deslize agora dura de 0,5 a 0,7 s.',
      'Jogando só com bots (inclusive uma sala online sem mais ninguém), o jogo agora pausa de verdade. Online com outra pessoa a partida continua rodando atrás do menu.',
    ] },
  { n: 81, v: '0.46.0', title: 'Desequilíbrio no deslize',
    criado: [
      'Trombada: acertar um inimigo durante o deslize causa um micro-atordoamento de 0,2 a 0,3 s nele. Nesse instante ele não ataca, não recarrega nem se move, e qualquer recarga, soco ou golpe em andamento é interrompido. Não causa dano, e cada deslize desequilibra o mesmo inimigo uma vez só.',
    ] },
  { n: 80, v: '0.45.0', title: 'Batida no deslize',
    criado: [

      'Punição: depois da batida o personagem fica atordoado e paralisado por 0,8 a 1,0 s (quanto maior a RESISTÊNCIA, menos tempo), totalmente exposto a tiros e golpes, sem poder andar, mirar, atirar, socar, recarregar ou deslizar.',
      'Recarga maior: a barrinha do deslize só começa a recarregar quando o atordoamento acaba e então leva o dobro do tempo (de 1,4 s nos mais ágeis a 2,1 s nos menos ágeis, conforme a AGILIDADE).',
    ] },
  { n: 79, v: '0.44.2', title: 'Deslize só para frente',
    modificado: [
      'O deslize (ESPAÇO) agora só funciona para a frente ou nas duas diagonais da frente, de acordo com para onde o personagem está virado. Para trás e para os lados não dá mais para deslizar.',
      'Durante o deslize, as mãos do personagem agora são iguais às mãos normais, sem a bolinha branca.',
    ] },
  { n: 78, v: '0.44.1', title: 'Braço reto com a arma',
    modificado: [
      'Ao mirar com uma arma de fogo, o braço direito do personagem fica totalmente reto, sem dobra no cotovelo. A saída do braço (o ombro) continua no mesmo lugar.',
    ] },
  { n: 77, v: '0.44.0', title: 'Sacar e guardar a arma',
    criado: [
      'Nova mecânica: a tecla Q (SACAR / GUARDAR ARMA, também na tela OPÇÕES) guarda a arma que está na mão e saca de novo. Com a arma guardada você luta de soco e uma dica na tela lembra de sacar; ao sacar, leva um instante até poder atirar.',
      'Pegar outra arma com a guardada saca a guardada primeiro; se você morrer, a arma guardada cai no chão junto. Funciona também nas partidas online e no celular (botão Q).',
    ],
    modificado: [
      'A cobertura saiu da tecla Q e foi para a tecla C (também mudou no botão de celular, que agora é C). Quem tinha a tecla Q salva em outra ação volta ao padrão dela.',
    ] },
  { n: 76, v: '0.43.1', title: 'Deslize em forma de rasteira',
    modificado: [
      'O deslize agora parece uma rasteira de verdade: o personagem escorrega no chão, meio deitado de costas, com uma perna esticada à frente e a outra dobrada, um braço apoiado no chão e poeira levantando atrás dele.',
    ],
    removido: ['O rastro de vento e a transparência do personagem durante o deslize, que davam cara de dash.'] },
  { n: 75, v: '0.43.0', title: 'Deslize tático',
    criado: [
      'Nova mecânica: Deslize Tático (tecla DESLIZAR, ESPAÇO por padrão). Correndo, aperte a tecla e o personagem desliza rápido pelo chão, em linha reta, desacelerando até parar.',

      'Durante o deslize dá para atravessar obstáculos baixos (tubulações e lixeiras) para trocar de cobertura rápido; o deslize também tira você da cobertura.',
      'Enquanto desliza não dá para atirar, socar nem arremessar a arma. Depois de usar, há uma pequena recarga, mostrada por uma barrinha embaixo do personagem.',
      'Rastro de vento atrás de quem desliza, som próprio e botão S na versão para celular. Funciona também nas partidas online.',
      'A tecla DESLIZAR aparece na tela OPÇÕES e pode ser trocada como as outras.',

  { n: 74, v: '0.42.9', title: 'Bola sobe direto do retângulo',

  { n: 66, v: '0.42.1', title: 'Soco-inglês mais forte',

  { n: 64, v: '0.41.0', title: 'Armas brancas maiores e soco-inglês de verdade',

  { n: 59, v: '0.36.0', title: 'Nova tela de personagens',

  { n: 58, v: '0.35.0', title: 'Raios de luz naturais e ponto de luz',

  { n: 57, v: '0.34.0', title: 'Luz saindo do retângulo e estatísticas alinhadas',

      'A arma demora mais para aparecer: sobe do retângulo depois da luz e então vai com a aura para a esquerda; as estatísticas entram por último.',

  { n: 56, v: '0.33.0', title: 'Nova tela de armas',
    criado: [
      'Faixa de retângulos deitados na parte de baixo da tela ARMAS, cada um com a silhueta toda branca da arma. O retângulo do meio é o selecionado e as pontas ficam cortadas.',
      'Ao entrar em ARMAS o retângulo do meio começa neutro (vazio); passando para o lado a faixa desliza e muda de arma.',

      'As estatísticas da arma (nome, calibre, descrição e barras) aparecem no lado direito, com entrada suave.',

  { n: 55, v: '0.32.0', title: 'Armas deitadas no chão',
    criado: ['Sprite cartoon minimalista de cada arma, em vista lateral, deitada no chão (Colt Python, Beretta 92FS, Sawed-Off, Glock 19, M1911 e Desert Eagle), com sombra e brilho na cor da arma.'],
    modificado: ['As armas no chão deixaram de aparecer em pé e flutuando; agora ficam deitadas, levemente giradas.', 'Na tela ARMAS, o desenho "VISTA DE CIMA (NO JOGO)" foi trocado por "NO CHÃO", com o novo sprite.'] },
  { n: 54, v: '0.31.0', title: 'Beretta 92FS e Sawed-Off Shotgun',
    criado: [
      'BERETTA 92FS (9mm Parabellum): pistola de quinze balas, dano 19 e boa precisão, com silhueta traçada da sua imagem, vista de cima própria e som de tiro próprio.',
      'SAWED-OFF SHOTGUN (Calibre 12): espingarda de cano duplo serrado com dois cartuchos. Cada tiro lança oito projéteis de 12 de dano, mortal de perto e fraca de longe, com recuo forte e som de tiro grave e longo.',
    ],
    removido: ['A LUGER P08 saiu do jogo (armas no chão, tela ARMAS, som de tiro e bots).'] },
  { n: 53, v: '0.30.0', title: 'Campo de batalha e tutorial',
    criado: [
      'CAMPO DE BATALHA agora funciona: abre a mesma configuração da sala personalizada (modo, pontos, dificuldade, bots, tempo e armas), com a opção de 0 bots para jogar só entre pessoas.',
      'Depois de CRIAR SALA, todos entram no lobby para lutar uns contra os outros, cada um por si. Quando todos estiverem em PRONTO, uma contagem de 3 segundos começa e a partida inicia sozinha (votação de mapa e escolha de personagem como nas outras salas). Se alguém cancelar o pronto ou entrar na sala, a contagem para.',
      'TUTORIAL agora funciona, no mapa DOCAS, em 10 passos: mover, mirar, socar, pegar arma, atirar, recarregar, arremessar, cobertura, espiar e uma prova final contra um bot fácil. Cada passo só avança quando você faz a ação; o alvo aparece marcado em amarelo e o painel mostra as teclas (ou botões, no celular). ENTER ou o botão PULAR pula o passo.',
      'No tutorial você não morre (a vida enche de novo) e o boneco de treino nunca cai. Ao terminar, aparece a tela TUTORIAL CONCLUÍDO com JOGAR, REPETIR TUTORIAL e MENU.',
    ],
    modificado: ['Os cartões CAMPO DE BATALHA e TUTORIAL da tela ESCOLHER MODO deixaram de ser EM BREVE e agora são clicáveis. O TUTORIAL continua virando TREINO ao segurar o mouse em cima.'] },
  { n: 52, v: '0.29.2', title: 'Cartões do treinamento iguais aos dos modos',
    modificado: [
      'Os cartões SOLITÁRIO e BOTS agora usam o mesmo fundo dos cartões 1v1, 2v2, 3v3 e 4v4: um degradê suave que começa mais claro em cima e escurece embaixo, com a mesma borda arredondada, o mesmo destaque ao passar o mouse e a mesma cor de texto.',
    ],
    removido: ['O brilho redondo atrás dos cartões do treinamento, que entrou na versão 0.29.1.'] },
  { n: 51, v: '0.29.1', title: 'Fundo iluminado no treinamento',
    modificado: [
      'A tela TREINAMENTO (SOLITÁRIO e BOTS) agora tem o mesmo fundo da votação de mapa: um preto iluminado, com um brilho suave atrás de cada cartão (mais forte quando o mouse está em cima), em vez de uma cor só.',
    ] },
  { n: 50, v: '0.29.0', title: 'Atributos dos personagens',
    criado: [
      'Cada personagem agora tem 7 atributos com nota de 1 a 10, pensados no jeito de cada um: VELOCIDADE, AGILIDADE, VIDA, RESISTÊNCIA, FORÇA, CONTROLE e RECARGA. Os 8 personagens atuais têm perfis bem diferentes (tanque lento, velocista frágil, atiradora precisa, brigão forte, assassino ágil, muro resistente, soldado metódico e caótico imprevisível), todos com a mesma soma de pontos, então ninguém é melhor em tudo.',
      'Na tela PERSONAGENS, embaixo da descrição, aparece o ESTILO do personagem e as 7 barras de atributo com o efeito real de cada um, no mesmo formato da tela ARMAS.',
      'Os atributos valem de verdade na partida (jogador, bots e amigos online): VELOCIDADE muda a corrida; AGILIDADE muda o arranque e a freada; VIDA muda os pontos de vida; RESISTÊNCIA diminui o tempo de nocaute e o empurrão ao levar dano; FORÇA muda o dano do soco; CONTROLE diminui a dispersão dos tiros; RECARGA muda o tempo para recarregar.',
      'A tabela de atributos fica em um lugar só (CSTATS), usada pelo jogo e pela tela, e cada personagem novo só precisa das 7 notas (st) e de uma linha de estilo (style).',
    ] },
  { n: 49, v: '0.28.3', title: 'Votação de mapa igual à de personagem',
    modificado: [
      'A votação de mapa agora tem o mesmo layout da escolha de personagem: em cima aparece o mapa votado por cada jogador (você à esquerda) e embaixo a grade de 9 colunas e 3 linhas, com os mesmos retângulos deitados, 26 vagas de mapa e o ? do ALEATÓRIO no centro.',
      'As vagas EM BREVE (de mapa e de personagem) ficaram só com o rabisco do cartão TUTORIAL (listras e borda tracejada). O texto EM BREVE só aparece quando o mouse passa por cima.',
    ],
    removido: ['A grade de 16 mapas em 2 linhas e a barra ALEATÓRIO embaixo dela.'] },
  { n: 48, v: '0.28.2', title: 'Retângulos deitados e grade de 16 mapas',
    modificado: [
      'Na seleção de personagem, cada personagem agora fica num retângulo deitado (mais largo que alto), mostrando a cabeça e os ombros.',
      'A votação de mapa usa o mesmo formato de grade: 16 vagas de mapa em retângulos deitados, com a miniatura e o nome. Os 3 mapas atuais ocupam as primeiras vagas e as outras 13 aparecem como EM BREVE. O ALEATÓRIO ficou numa barra embaixo da grade.',
      'As vagas vazias da seleção de personagem também mostram EM BREVE.',
    ] },
  { n: 47, v: '0.28.1', title: 'Grade de personagens em retângulos e 26 vagas',
    modificado: [
      'Na seleção de personagem, cada personagem agora aparece num retângulo em pé (cabeça e ombros) em vez de um quadrado, e a grade tem 3 linhas.',
      'A grade já tem as 26 vagas previstas para o jogo, com o ? do aleatório no centro. Só as 8 primeiras estão ocupadas pelos personagens atuais; as outras aparecem vazias e vão sendo preenchidas quando novos personagens forem criados.',
    ] },
  { n: 46, v: '0.28.0', title: 'Votação de mapa e escolha de personagem',
    criado: [
      'Depois que o anfitrião toca em INICIAR PARTIDA (com todos prontos), aparece a votação de MAPA para todos da sala: os três mapas e a opção ALEATÓRIO, com 12 segundos de tempo. Bolinhas coloridas mostram quem votou em cada um.',
      'Regras da votação: vence o mapa com mais votos. Se ninguém votar, ou se ALEATÓRIO tiver a maioria, o mapa é sorteado. Empate sorteia entre os empatados. O mapa escolhido aparece por um instante antes de seguir.',
      'Em seguida vem a escolha de PERSONAGEM, no estilo da imagem de referência: o personagem de cada jogador aparece em cima (você à esquerda) e a grade de rostos fica embaixo, com o ? do aleatório no meio. São 25 segundos.',
      'Para escolher é preciso clicar duas vezes: o 1º clique marca o personagem e o 2º confirma. Quem confirma primeiro fica com ele, e ele fica bloqueado para os outros, com o nome de quem pegou. Se o tempo acabar, o personagem marcado é confirmado (ou sorteado, se já tiver sido pego).',
      'Quem confirmar ALEATÓRIO espera os outros escolherem. Então o jogo passa de personagem em personagem, desacelera e para em um dos que sobraram. Com o sorteio feito, a partida começa.',
    ],
    modificado: [

  const ent = scrEnter('join'); ctx.fillStyle = '#070707'; ctx.fillRect(0, 0, innerWidth, innerHeight); ctx.save(); ctx.scale(ms, ms);
  const Rf = clamp(Math.min(IW * .58 / 5.3, IH * .34), 64, 190), s = Rf / 132, wx = IW * .42, cy = IH / 2 + 6, eA = ent(0), eB = ent(.25);
  if (JOIN_ARM.complete && JOIN_ARM.naturalWidth) { ctx.globalAlpha = eA; ctx.drawImage(JOIN_ARM, wx - 751 * s - (1 - eA) * 80, cy - 479 * s, 1448 * s, 1086 * s); ctx.globalAlpha = 1; }
  // código dentro do relógio (medidas tiradas da arte: centro do mostrador em wx, cy)
  ctx.globalAlpha = eB;
  const sS = 32 * s;
  for (let i = 0; i < 4; i++) { const x = wx + (i - 1.5) * 38 * s - sS / 2, y = cy - 88 * s - sS / 2; ctx.beginPath(); ctx.roundRect(x + .5, y + .5, sS - 1, sS - 1, 6 * s); ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fill(); ctx.strokeStyle = i === JOIN.length ? INK : 'rgba(255,255,255,.2)'; ctx.lineWidth = i === JOIN.length ? 2 : 1; ctx.stroke(); if (JOIN[i]) txt(JOIN[i], x + sS / 2, y + sS / 2 + 1, 21 * s, INK, 'center'); }
  const stTxt = NET.err || (NET.busy ? NET.msg : 'CÓDIGO DE 4 DÍGITOS'); txt(stTxt, wx, cy - 58 * s, Math.min(9.5 * s, 300 * s / Math.max(12, stTxt.length)), NET.err ? '#ff6b6b' : MUTE, 'center');
  const kw = 60 * s, kh = 33 * s, keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'APAGAR', '0', 'ENTRAR'];
  keys.forEach((kk, i) => { const x = wx + ((i % 3) - 1) * 67 * s - kw / 2, yy = cy + (-29.5 + Math.floor(i / 3) * 37.5) * s - kh / 2;
    button(kk, x, yy, kw, kh, kk === 'APAGAR' ? () => { JOIN = JOIN.slice(0, -1); } : kk === 'ENTRAR' ? doJoin : () => addDigit(kk), kk === 'ENTRAR' && JOIN.length === 4 && !NET.busy ? 'primary' : undefined); });
  ctx.globalAlpha = 1;
  scrHead('ENTRAR NA SALA', IW / 2, 24, 22, IW, ent);
  cornerBtn('VOLTAR', -1, IW, IH, () => { netReset(); setState('modes'); });
  ctx.restore();
}

/* ---------------------------- GAME LOOP ------------------------------- */
let last = performance.now();
function loop(now) {
  perfTick(now - last); let dt = Math.min((now - last) / 1000, .05); last = now; ui = []; const rdt = dt;
  updateMusic();
  if (state === 'intro') { if (!introGate) introT += dt; drawIntro(introT); }
  else if (state === 'train') { menuT += dt; drawTrain(menuT); }
  else if (state === 'modes') { menuT += dt; drawModes(menuT); }
  else if (state === 'maps') { menuT += dt; drawMaps(menuT); }
  else if (state === 'setup') { menuT += dt; drawSetup(menuT); }
  else if (state === 'pick') { menuT += dt; if (NET.host) selStep(rdt); else if (NET.sel) NET.sel.t = Math.min(NET.sel.dur, NET.sel.t + rdt); drawPick(menuT); }
  else if (state === 'room') { menuT += dt; bgTick(rdt); drawRoom(menuT); }
  else if (state === 'join') { menuT += dt; drawJoin(menuT); }
  else if (state === 'options') { menuT += dt; drawOptions(menuT); }
  else if (state === 'menu') { menuT += dt; drawMenu(menuT); }
  else if (state === 'info') { menuT += dt; drawInfo(menuT); }
  else if (state === 'log') { menuT += dt; drawLog(menuT); }
  else if (state === 'chars') { menuT += dt; drawChars(menuT); }
  else {
    menuT += dt;
    if (hitStop > 0) { hitStop -= dt; dt = 0; }   // hit stop no impacto do soco
    if (NET.cl) clientStep(rdt);
    else {
    let frozen = (state === 'pause' || state === 'tutend') && (!NET.online || (NET.host && !NET.guests.length));   // pausado: tudo congelado (só com bots: online com outra pessoa a partida não para)
    if (!frozen && M && !training) { const r = stepMatch(dt); if (r < 0) frozen = true; else dt = r; }   // contagem, rodadas e relógio
    if (frozen) { input.interact = input.throwReq = input.reloadReq = input.coverReq = input.slideReq = input.holsterReq = input.down = false; } else updatePlay(dt);
    }
    updateCam(); netTick(rdt);
    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    if (shake > 0) ctx.translate(rnd(-.5, .5) * shake, rnd(-.5, .5) * shake);
    ctx.translate(-cam.x, -cam.y);
    drawFloor();
    for (const d of decals) { ctx.fillStyle = `rgba(150,10,35,${d.a})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill(); }
    drawBlood();
    drawPickups(menuT); drawCrates();
    if (M && M.team) for (const f of [player, ...bots]) if (!f.dead) {   // anel no chão: verde = seu time, vermelho = inimigo
      ctx.strokeStyle = f.team === player.team ? 'rgba(143,214,164,.85)' : 'rgba(255,90,90,.75)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, 24, 0, TAU); ctx.stroke();
    }
    for (const b of bots) if (!b.dead) drawFighter(b);
    if (!player.dead) drawFighter(player);
    drawThrown(); drawFx();
    if (showHit) for (const f of [player, ...bots]) for (const h of ['left', 'right']) {
      const p = f.punch[h]; if (f.dead || p.t < .2 || p.t > .44) continue;
      const fl = fistLocal(f, h), w = toWorld(f, fl.x, fl.y); ctx.strokeStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(w.x, w.y, C.hitRadius, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    // sem vinheta nem névoa escura ao redor do personagem: o mapa inteiro aparece claro; um leve clareamento deixa o piso mais visível
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(0, 0, innerWidth, innerHeight); ctx.restore();
    drawHUD(menuT);
    if (state === 'dead') drawDead();
    if (state === 'pause') drawPause();
    if (state === 'tutend') drawTutEnd();
    if (state === 'mend' && M) drawMatchEnd();
  }
  if (TOUCH && state === 'play' && innerHeight > innerWidth) {   // pede para girar o celular
    ctx.fillStyle = 'rgba(8,4,18,.92)'; ctx.fillRect(0, 0, innerWidth, innerHeight);
    txt('GIRE O CELULAR', innerWidth / 2, innerHeight / 2 - 12, Math.min(26, innerWidth / 12), '#e7e4d3', 'center');
    txt('(modo paisagem)', innerWidth / 2, innerHeight / 2 + 22, 14, '#8a8a96', 'center');
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

<script>
/* ---- Tela cheia + horizontal travada (celular) ---- */
(function () {
  const gate = document.getElementById('fsGate'), btn = document.getElementById('fsBtn'), skip = document.getElementById('fsSkip'), ios = document.getElementById('fsIos');
  const touchDev = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  if (!touchDev) return;
  const de = document.documentElement;
  const reqFs = de.requestFullscreen || de.webkitRequestFullscreen || de.msRequestFullscreen;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const standalone = () => matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let skipped = false;
  const lock = () => { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
  const update = () => {
    const ok = isFs() || standalone() || skipped;
    gate.classList.toggle('show', !ok);
    if (!reqFs) { btn.style.display = 'none'; ios.style.display = 'block'; skip.style.display = 'inline-block'; }
    if (isFs() || standalone()) lock();
    window.dispatchEvent(new Event('resize'));
  };
  btn.addEventListener('click', () => {
    try { const p = reqFs.call(de, { navigationUI: 'hide' }); if (p && p.then) p.then(lock).catch(() => {}); else lock(); } catch (e) {}
    setTimeout(lock, 300); setTimeout(update, 400);
  });
  skip.addEventListener('click', () => { skipped = true; update(); });
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('webkitfullscreenchange', update);
  addEventListener('orientationchange', () => setTimeout(update, 200));
  update();
  try {
    const m = { name: 'OUTCOME', short_name: 'OUTCOME', start_url: location.href.split('#')[0], scope: location.href.replace(/[^\/]*$/, ''), display: 'fullscreen', orientation: 'landscape', background_color: '#0d0a14', theme_color: '#0d0a14' };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  } catch (e) {}
})();
</script>
<script>
/* Ícone do site: o mesmo chapéu de feltro que fica em cima do O do título (logoHat), desenhado numa tela escondida. */
(function () {
  function hatIcon(N) {
    const c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
    const s = N * .94 / 110; g.save(); g.translate(N / 2, N / 2 + 11.5 * s); g.scale(s, s);   // fundo transparente: só o chapéu, reto
    logoHat(g, '#0d0d11', '#e7e4d3', true); g.restore(); return c.toDataURL('image/png');
  }
  try {
    const i32 = hatIcon(64), i180 = hatIcon(180), i192 = hatIcon(192), i512 = hatIcon(512);
    const add = (rel, href, sizes) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (sizes) l.sizes = sizes; document.head.appendChild(l); };
    document.querySelectorAll('link[rel~="icon"]').forEach(l => l.remove());
    add('icon', i32, '64x64'); add('apple-touch-icon', i180, '180x180');
    const old = document.querySelector('link[rel="manifest"]');
    if (old) {   // refaz o manifesto já com o ícone do chapéu
      const m = { name: 'OUTCOME', short_name: 'OUTCOME', start_url: location.href.split('#')[0], scope: location.href.replace(/[^\/]*$/, ''), display: 'fullscreen', orientation: 'landscape', background_color: '#0d0a14', theme_color: '#0d0a14',
        icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
      old.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    }
  } catch (e) {}
})();
</script>
