const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

function drawSilhouette(w, x, y, sc, flip) {
  const S = w.sil; ctx.save(); ctx.fillStyle = '#e7e4d3';
  if (flip && !S.noFlip) { ctx.translate(x + S.w * sc, y); ctx.scale(-sc, sc); } else { ctx.translate(x, y); ctx.scale(sc, sc); }
  S.draw(); ctx.restore();
}

/* Braço de 2 segmentos (o comprimento se adapta, então nunca "desconecta") */
function drawArm(f, sx, sy, F, side, k = .52, hold = false) {   // k: quanto o braço se dobra (.52 normal, .505 quase reto)
  const dx = F.x - sx, dy = F.y - sy, d = Math.max(Math.hypot(dx, dy), .001);
  const L = Math.max(10, d * k), h = Math.sqrt(Math.max(L * L - d * d / 4, 0));
  const ex = sx + dx / 2 + (-dy / d) * side * h, ey = sy + dy / 2 + (dx / d) * side * h;
  const seg = (ax, ay, bx, by, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); };
  seg(sx, sy, ex, ey, 9.5, (f.pal.bare ? f.pal.skinD : f.pal.jDark));
  const hp = handPath(F, Math.atan2(F.y - ey, F.x - ex), Math.max(F.ext || 0, 0), side, hold);
  // contorno só em volta do antebraço + mão juntos: primeiro tudo em tom escuro, depois o preenchimento por cima apaga a borda da emenda
  seg(ex, ey, F.x, F.y, 8, f.pal.skinD); ctx.strokeStyle = f.pal.skinD; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.stroke(hp);
  seg(sx, sy, ex, ey, 7.5, (f.pal.bare ? f.pal.skin : f.pal.jacket));
  seg(ex, ey, F.x, F.y, 6, f.pal.skin); ctx.fillStyle = f.pal.skin; ctx.fill(hp);
}
function handPath(F, a, ext, side, hold) {   // punho fechado visto de cima (como numa mão segurando um cabo): fino no pulso, mais largo nos dedos; o cano sai pela frente

  const pt = (x, y) => [F.x + (x * c - y * s) * k, F.y + (x * s + y * c) * k];
  const pt2 = (x, y) => pt(x, y * side);   // espelha para a mão esquerda/direita (o polegar fica do lado do corpo)
  if (!hold) {   // mão livre (soco/solta): punho fechado de lado, com o polegar sobre os dedos e a fileira de nós dos dedos na frente

function drawFighter(f) {

}

function applySnap(S) {

function netSendInput(dt) {

function clientStep(dt) {

  player.near = null; let bd = 46; for (const pk of pickups) { const q = Math.hypot(pk.x - player.x, pk.y - player.y); if (q < bd) { bd = q; player.near = pk; } }
  M.phaseT += dt; M.flashT = Math.max(0, M.flashT - dt); if (M.phase === 'fight') M.left = Math.max(0, M.left - dt);
  if (M.phase === 'count') { const n = Math.floor(M.phaseT); if (n !== M.beep && n < 3) { M.beep = n; sfxBeep(n === 2 ? 880 : 660, .13); } }

  for (const t of trail) t.life -= dt * 9; trail = trail.filter(t => t.life > 0);

}

/* ---------------------------- GAME LOOP ------------------------------- */
let last = performance.now();
function loop(now) {
  perfTick(now - last); let dt = Math.min((now - last) / 1000, .05); last = now; ui = []; const rdt = dt;
  updateMusic();
  if (state === 'intro') { if (!introGate) introT += dt; drawIntro(introT); }
  else if (state === 'train') { menuT += dt; drawTrain(menuT); }
  else if (state === 'modes') { menuT += dt; drawModes(menuT); }
  else if (state === 'maps') { menuT += dt; drawMaps(menuT); }
  else if (state === 'setup') { menuT += dt; drawSetup(menuT); }
  else if (state === 'pick') { menuT += dt; if (NET.host) selStep(rdt); else if (NET.sel) NET.sel.t = Math.min(NET.sel.dur, NET.sel.t + rdt); drawPick(menuT); }
  else if (state === 'room') { menuT += dt; drawRoom(menuT); }
  else if (state === 'join') { menuT += dt; drawJoin(menuT); }
  else if (state === 'options') { menuT += dt; drawOptions(menuT); }
  else if (state === 'menu') { menuT += dt; drawMenu(menuT); }
  else if (state === 'info') { menuT += dt; drawInfo(menuT); }
  else if (state === 'log') { menuT += dt; drawLog(menuT); }
  else if (state === 'chars') { menuT += dt; drawChars(menuT); }

    }

    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    if (shake > 0) ctx.translate(rnd(-.5, .5) * shake, rnd(-.5, .5) * shake);
    ctx.translate(-cam.x, -cam.y);
    drawFloor();
    for (const d of decals) { ctx.fillStyle = `rgba(150,10,35,${d.a})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill(); }

      ctx.strokeStyle = f.team === player.team ? 'rgba(143,214,164,.85)' : 'rgba(255,90,90,.75)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, 24, 0, TAU); ctx.stroke();

    txt('(modo paisagem)', innerWidth / 2, innerHeight / 2 + 22, 14, '#8a8a96', 'center');
  }
  requestAnimationFrame(loop);
}
